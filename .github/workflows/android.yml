# Build the Android app (a debug APK you can install straight onto a phone) on every push to main.
# Download it from the run's "Artifacts" section, open it on the phone, allow installing from that source.
name: Android app

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run app:web
      - run: npx cap sync android
      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: lofi-your-life-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
